name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Website
        run: |
          sudo apt-get install -y httrack imagemagick
          httrack https://www.alomariya.org/ -O ./site -r5 -%v -X "*.mp4" -X "*.mp3"
          mv ./site/www.alomariya.org ./webfiles

      - name: Download QA Pages
        run: |
          for i in $(seq 1 333); do
            mkdir -p "./webfiles/سؤال-وجواب/page/$i"
            wget -q "https://www.alomariya.org/سؤال-وجواب/page/$i/" \
              -O "./webfiles/سؤال-وجواب/page/$i/index.html" || true
            sleep 0.3
          done

      - name: Fix Structure
        run: |
          python3 << 'PYEOF'
          import os, hashlib, json, shutil, urllib.parse

          # Step 1: Build mapping from Arabic paths to safe paths
          # Walk and find all Arabic-named directories
          arabic_dirs = {}

          for root, dirs, files in os.walk('./webfiles'):
              rel_root = os.path.relpath(root, './webfiles')
              if rel_root == '.':
                  rel_root = ''
              parts = rel_root.replace('\\', '/').split('/') if rel_root else []
              for i, part in enumerate(parts):
                  if any(ord(c) > 127 for c in part):
                      orig_path = '/'.join(parts[:i+1])
                      if orig_path not in arabic_dirs:
                          safe = 'dir_' + hashlib.md5(orig_path.encode()).hexdigest()[:8]
                          arabic_dirs[orig_path] = safe

          print(f'Arabic dirs found: {arabic_dirs}')

          # Step 2: Fix all links in HTML/JS/CSS files BEFORE renaming
          def fix_content(txt):
              txt = txt.replace('https://www.alomariya.org', 'http://localhost:8080')
              txt = txt.replace('http://www.alomariya.org', 'http://localhost:8080')
              txt = txt.replace('https:\\/\\/www.alomariya.org', 'http:\\/\\/localhost:8080')
              txt = txt.replace('http:\\/\\/www.alomariya.org', 'http:\\/\\/localhost:8080')
              # Replace Arabic dir names with safe names in URLs
              for arabic, safe in arabic_dirs.items():
                  txt = txt.replace('/' + arabic + '/', '/' + safe + '/')
                  txt = txt.replace('/' + arabic + '"', '/' + safe + '"')
                  txt = txt.replace('/' + arabic + "'", '/' + safe + "'")
                  encoded = urllib.parse.quote(arabic, safe='')
                  txt = txt.replace('/' + encoded + '/', '/' + safe + '/')
              return txt

          for root, dirs, files in os.walk('./webfiles'):
              for f in files:
                  if not (f.endswith('.html') or f.endswith('.js') or f.endswith('.css')):
                      continue
                  path = os.path.join(root, f)
                  try:
                      txt = open(path, encoding='utf-8', errors='ignore').read()
                      fixed = fix_content(txt)
                      if fixed != txt:
                          open(path, 'w', encoding='utf-8').write(fixed)
                  except:
                      pass

          # Step 3: Rename Arabic dirs (bottom-up)
          for root, dirs, files in os.walk('./webfiles', topdown=False):
              rel_root = os.path.relpath(root, './webfiles').replace('\\', '/')
              if rel_root == '.':
                  continue
              parts = rel_root.split('/')
              for i, part in enumerate(parts):
                  if any(ord(c) > 127 for c in part):
                      orig_path = '/'.join(parts[:i+1])
                      if orig_path in arabic_dirs:
                          safe = arabic_dirs[orig_path]
                          old = './webfiles/' + orig_path
                          new = './webfiles/' + '/'.join(parts[:i]) + '/' + safe if i > 0 else './webfiles/' + safe
                          if os.path.exists(old) and not os.path.exists(new):
                              try:
                                  shutil.move(old, new)
                                  print(f'Renamed: {old} -> {new}')
                              except Exception as e:
                                  print(f'Error: {e}')
                          break

          # Save mapping for server
          with open('./webfiles/urlmap.json', 'w', encoding='utf-8') as f:
              json.dump(arabic_dirs, f, ensure_ascii=False)

          print('Done!')
          PYEOF

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/alomariya/app
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp -r webfiles/* app/src/main/assets/www/
          convert icon.jpg -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.jpg -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.jpg -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.jpg -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.jpg -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create Files
        run: |
          cat > app/src/main/java/com/alomariya/app/LocalServer.java << 'EOF'
          package com.alomariya.app;
          import android.content.Context;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          public class LocalServer extends Thread {
              private final Context ctx;
              private volatile boolean ready = false;
              public LocalServer(Context ctx) { this.ctx = ctx; setDaemon(true); }
              public boolean isReady() { return ready; }
              public void run() {
                  try {
                      ServerSocket server = new ServerSocket(8080);
                      ready = true;
                      while (true) { new Handler(server.accept(), ctx).start(); }
                  } catch (Exception e) {}
              }
              static class Handler extends Thread {
                  Socket s; Context ctx;
                  Handler(Socket s, Context ctx) { this.s=s; this.ctx=ctx; setDaemon(true); }
                  public void run() {
                      try {
                          BufferedReader r = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                          String line = r.readLine();
                          if (line == null) { s.close(); return; }
                          String path = line.split(" ")[1];
                          if (path.contains("?")) path = path.substring(0, path.indexOf("?"));
                          if (path.endsWith("/")) path = path + "index.html";
                          if (!path.contains(".")) path = path + "/index.html";
                          String assetPath = "www" + path;
                          String mime = "text/html;charset=utf-8";
                          if (path.endsWith(".css")) mime = "text/css";
                          else if (path.endsWith(".js")) mime = "application/javascript";
                          else if (path.endsWith(".png")) mime = "image/png";
                          else if (path.endsWith(".jpg")||path.endsWith(".jpeg")) mime = "image/jpeg";
                          else if (path.endsWith(".gif")) mime = "image/gif";
                          else if (path.endsWith(".pdf")) mime = "application/pdf";
                          else if (path.endsWith(".woff")||path.endsWith(".woff2")) mime = "font/woff2";
                          OutputStream out = s.getOutputStream();
                          try {
                              InputStream in = ctx.getAssets().open(assetPath);
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              byte[] buf = new byte[8192]; int n;
                              while ((n = in.read(buf)) != -1) bos.write(buf, 0, n);
                              byte[] data = bos.toByteArray();
                              String header = "HTTP/1.1 200 OK\r\nContent-Type: "+mime+"\r\nContent-Length: "+data.length+"\r\nAccess-Control-Allow-Origin: *\r\n\r\n";
                              out.write(header.getBytes(StandardCharsets.UTF_8));
                              out.write(data);
                          } catch (Exception e) {
                              String notFound = "<html><body>404: "+path+"</body></html>";
                              byte[] data = notFound.getBytes(StandardCharsets.UTF_8);
                              out.write(("HTTP/1.1 404 Not Found\r\nContent-Length: "+data.length+"\r\n\r\n").getBytes());
                              out.write(data);
                          }
                          out.flush(); s.close();
                      } catch (Exception e) {}
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/alomariya/app/MainActivity.java << 'EOF'
          package com.alomariya.app;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.browser.customtabs.CustomTabsIntent;
          public class MainActivity extends Activity {
              LocalServer server;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  server = new LocalServer(this);
                  server.start();
                  new Handler().post(new Runnable() {
                      public void run() {
                          if (server.isReady()) {
                              CustomTabsIntent.Builder builder = new CustomTabsIntent.Builder();
                              builder.setShowTitle(false);
                              builder.setUrlBarHidingEnabled(true);
                              CustomTabsIntent customTabsIntent = builder.build();
                              customTabsIntent.launchUrl(MainActivity.this, Uri.parse("http://localhost:8080/"));
                          } else {
                              new Handler().postDelayed(this, 100);
                          }
                      }
                  });
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.alomariya.app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="العمريّة للتجديد الصوفي"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p gradle/wrapper
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.alomariya.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.alomariya.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.browser:browser:1.5.0'
          }
          EOF
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -Lo gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.1.1/gradle/wrapper/gradle-wrapper.jar
          curl -Lo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.1.1/gradlew
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alomariya-apk
          path: app/build/outputs/apk/debug/app-debug.apk
