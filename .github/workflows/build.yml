name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Website
        run: |
          sudo apt-get install -y httrack imagemagick
          httrack https://www.alomariya.org/ -O ./site -r5 -%v -X "*.mp4" -X "*.mp3"
          mv ./site/www.alomariya.org ./webfiles

      - name: Fix and Flatten
        run: |
          python3 << 'EOF'
          import os, urllib.parse, hashlib, json, shutil

          mapping = {}
          os.makedirs('./flatfiles', exist_ok=True)

          for root, dirs, files in os.walk('./webfiles'):
              for f in files:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, './webfiles')
                  rel_url = '/' + rel.replace(os.sep, '/')
                  ext = os.path.splitext(f)[1].lower()

                  if any(ord(c) > 127 for c in rel_url):
                      safe = hashlib.md5(rel_url.encode()).hexdigest()
                      new_name = safe + ext
                      # Store both encoded (uppercase) and decoded versions
                      encoded = urllib.parse.quote(rel_url, safe='/-.')
                      mapping[encoded.upper()] = new_name
                      mapping[encoded] = new_name
                      mapping[rel_url] = new_name
                  else:
                      new_name = rel_url.replace('/', '_').lstrip('_')
                      mapping[rel_url] = new_name

                  dest = os.path.join('./flatfiles', new_name)
                  try:
                      shutil.copy2(full, dest)
                  except Exception as e:
                      print(f'Skip copy: {e}')

          for name in os.listdir('./flatfiles'):
              path = os.path.join('./flatfiles', name)
              if not (name.endswith('.html') or name.endswith('.js')):
                  continue
              txt = open(path, encoding='utf-8', errors='ignore').read()
              txt = txt.replace('https://www.alomariya.org', 'http://localhost:8080')
              txt = txt.replace('http://www.alomariya.org', 'http://localhost:8080')
              txt = txt.replace('https:\\/\\/www.alomariya.org', 'http:\\/\\/localhost:8080')
              txt = txt.replace('http:\\/\\/www.alomariya.org', 'http:\\/\\/localhost:8080')
              open(path, 'w', encoding='utf-8').write(txt)

          with open('./flatfiles/urlmap.json', 'w', encoding='utf-8') as f:
              json.dump(mapping, f, ensure_ascii=False)

          print(f'Done. {len(mapping)} entries.')
          EOF

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/alomariya/app
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp -r flatfiles/* app/src/main/assets/www/
          convert icon.jpg -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.jpg -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.jpg -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.jpg -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.jpg -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create Files
        run: |
          cat > app/src/main/java/com/alomariya/app/LocalServer.java << 'EOF'
          package com.alomariya.app;
          import android.content.Context;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          public class LocalServer extends Thread {
              private final Context ctx;
              private volatile boolean ready = false;
              private JSONObject urlMap = null;
              public LocalServer(Context ctx) {
                  this.ctx = ctx;
                  setDaemon(true);
                  try {
                      InputStream is = ctx.getAssets().open("www/urlmap.json");
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192]; int n;
                      while ((n = is.read(buf)) != -1) bos.write(buf, 0, n);
                      urlMap = new JSONObject(bos.toString("UTF-8"));
                  } catch (Exception e) {}
              }
              public boolean isReady() { return ready; }
              public void run() {
                  try {
                      ServerSocket server = new ServerSocket(8080);
                      ready = true;
                      while (true) { new Handler(server.accept(), ctx, urlMap).start(); }
                  } catch (Exception e) {}
              }
              static class Handler extends Thread {
                  Socket s; Context ctx; JSONObject urlMap;
                  Handler(Socket s, Context ctx, JSONObject urlMap) {
                      this.s=s; this.ctx=ctx; this.urlMap=urlMap; setDaemon(true);
                  }
                  public void run() {
                      try {
                          BufferedReader r = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                          String line = r.readLine();
                          if (line == null) { s.close(); return; }
                          String path = line.split(" ")[1];
                          if (path.contains("?")) path = path.substring(0, path.indexOf("?"));
                          if (path.endsWith("/")) path = path + "index.html";
                          if (!path.contains(".")) path = path + "/index.html";

                          // Normalize %xx to uppercase
                          StringBuilder sb = new StringBuilder(path);
                          for (int i = 0; i < sb.length(); i++) {
                              if (sb.charAt(i) == '%' && i + 2 < sb.length()) {
                                  sb.setCharAt(i+1, Character.toUpperCase(sb.charAt(i+1)));
                                  sb.setCharAt(i+2, Character.toUpperCase(sb.charAt(i+2)));
                                  i += 2;
                              }
                          }
                          String normalizedPath = sb.toString();

                          String assetName = null;
                          if (urlMap != null) {
                              if (urlMap.has(normalizedPath)) {
                                  assetName = urlMap.getString(normalizedPath);
                              } else if (urlMap.has(path)) {
                                  assetName = urlMap.getString(path);
                              } else {
                                  try {
                                      String decoded = URLDecoder.decode(path, "UTF-8");
                                      if (urlMap.has(decoded)) {
                                          assetName = urlMap.getString(decoded);
                                      }
                                  } catch (Exception e) {}
                              }
                          }
                          if (assetName == null) {
                              assetName = path.replace('/', '_').replaceAll("^_+", "");
                          }

                          String assetPath = "www/" + assetName;
                          String mime = "text/html;charset=utf-8";
                          if (path.endsWith(".css")) mime = "text/css";
                          else if (path.endsWith(".js")) mime = "application/javascript";
                          else if (path.endsWith(".png")) mime = "image/png";
                          else if (path.endsWith(".jpg")||path.endsWith(".jpeg")) mime = "image/jpeg";
                          else if (path.endsWith(".gif")) mime = "image/gif";
                          else if (path.endsWith(".pdf")) mime = "application/pdf";
                          else if (path.endsWith(".woff")||path.endsWith(".woff2")) mime = "font/woff2";
                          OutputStream out = s.getOutputStream();
                          try {
                              InputStream in = ctx.getAssets().open(assetPath);
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              byte[] buf = new byte[8192]; int n;
                              while ((n = in.read(buf)) != -1) bos.write(buf, 0, n);
                              byte[] data = bos.toByteArray();
                              String header = "HTTP/1.1 200 OK\r\nContent-Type: "+mime+"\r\nContent-Length: "+data.length+"\r\nAccess-Control-Allow-Origin: *\r\n\r\n";
                              out.write(header.getBytes(StandardCharsets.UTF_8));
                              out.write(data);
                          } catch (Exception e) {
                              String notFound = "<html><body>404: "+path+"</body></html>";
                              byte[] data = notFound.getBytes(StandardCharsets.UTF_8);
                              out.write(("HTTP/1.1 404 Not Found\r\nContent-Length: "+data.length+"\r\n\r\n").getBytes());
                              out.write(data);
                          }
                          out.flush(); s.close();
                      } catch (Exception e) {}
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/alomariya/app/MainActivity.java << 'EOF'
          package com.alomariya.app;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.browser.customtabs.CustomTabsIntent;
          public class MainActivity extends Activity {
              LocalServer server;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  server = new LocalServer(this);
                  server.start();
                  new Handler().post(new Runnable() {
                      public void run() {
                          if (server.isReady()) {
                              CustomTabsIntent.Builder builder = new CustomTabsIntent.Builder();
                              builder.setShowTitle(false);
                              builder.setUrlBarHidingEnabled(true);
                              CustomTabsIntent customTabsIntent = builder.build();
                              customTabsIntent.launchUrl(MainActivity.this, Uri.parse("http://localhost:8080/"));
                          } else {
                              new Handler().postDelayed(this, 100);
                          }
                      }
                  });
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.alomariya.app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="العمريّة للتجديد الصوفي"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p gradle/wrapper
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.alomariya.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.alomariya.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.browser:browser:1.5.0'
          }
          EOF
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -Lo gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.1.1/gradle/wrapper/gradle-wrapper.jar
          curl -Lo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.1.1/gradlew
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alomariya-apk
          path: app/build/outputs/apk/debug/app-debug.apk
