name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download Website
        run: |
          sudo apt-get install -y httrack
          httrack https://www.alomariya.org/ -O ./site -r8 -%v -X "*.mp4" -X "*.mp3"
          mv ./site/www.alomariya.org ./www

      - name: Fix HTML
        run: |
          cat > fix.py << 'EOF'
          import os, re
          for root, dirs, files in os.walk('./www'):
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  path = os.path.join(root, f)
                  txt = open(path, encoding='utf-8', errors='ignore').read()
                  # Fix viewport
                  txt = re.sub(r'<meta name="viewport"[^>]*>', '', txt)
                  txt = txt.replace('<head>', '<head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">')
                  # Remove external scripts causing freeze
                  txt = re.sub(r'<script[^>]*src="https?://(?!www\.alomariya\.org)[^"]*"[^>]*></script>', '', txt)
                  # Fix PDF buttons - convert JS calls to direct links
                  txt = re.sub(r'href="javascript:[^"]*"([^>]*?)data-url="([^"]*\.pdf)"', r'href="\2"\1', txt)
                  open(path, 'w', encoding='utf-8').write(txt)
          print('Done fixing HTML files')
          EOF
          python3 fix.py

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@4 @capacitor/cli@4 @capacitor/android@4
          npx cap init ALOMARIYA com.alomariya.app --web-dir www
          npx cap add android

      - name: Fix WebView
        run: |
          cat > android/app/src/main/java/com/alomariya/app/MainActivity.java << 'EOF'
          package com.alomariya.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebSettings s = getBridge().getWebView().getSettings();
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alomariya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
