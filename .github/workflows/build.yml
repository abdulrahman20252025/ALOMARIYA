name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Website
        run: |
          sudo apt-get install -y httrack
          httrack https://www.alomariya.org/ -O ./site -r5 -%v -X "*.mp4" -X "*.mp3"
          mv ./site/www.alomariya.org ./webfiles

      - name: Clone WebView Template
        run: |
          git clone https://github.com/mgks/Android-SmartWebView.git template
          cp -r webfiles/* template/app/src/main/assets/
          sed -i 's|ASWV_URL.*=.*"[^"]*"|ASWV_URL = "file:///android_asset/index.html"|' \
            template/app/src/main/java/mgks/os/swv/SmartWebView.java

      - name: Build APK
        run: |
          cd template
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alomariya-apk
          path: template/app/build/outputs/apk/debug/app-debug.apk
