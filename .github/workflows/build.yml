name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download Website
        run: |
          sudo apt-get install -y httrack
          httrack https://www.alomariya.org/ -O ./site -r9 -%v \
            -X "*.mp4" -X "*.mp3" \
            +*.pdf
          mv ./site/www.alomariya.org ./www

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@4 @capacitor/cli@4 @capacitor/android@4
          npx cap init ALOMARIYA com.alomariya.app --web-dir www
          npx cap add android

      - name: Fix WebView
        run: |
          cat > android/app/src/main/java/com/alomariya/app/MainActivity.java << 'EOF'
          package com.alomariya.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  WebSettings s = webView.getSettings();
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(
                              "var m=document.querySelector('meta[name=viewport]');" +
                              "if(m){m.setAttribute('content','width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no');}" +
                              "else{var n=document.createElement('meta');n.name='viewport';" +
                              "n.content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no';" +
                              "document.head.appendChild(n);}",
                              null
                          );
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alomariya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
