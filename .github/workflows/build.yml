name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.alomariya.app "العمري الحسني"
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp -r ../www/* www/
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.alomariya.app" version="1.0.0"
              xmlns="http://www.w3.org/ns/widgets"
              xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>العمري الحسني</name>
              <preference name="DisallowOverscroll" value="true" />
              <preference name="android-minSdkVersion" value="21" />
              <preference name="Orientation" value="default" />
              <preference name="SetFullscreen" value="false" />
              <preference name="BackgroundColor" value="0xFFFFFFFF" />
              <preference name="LoadUrlTimeoutValue" value="700000" />
              <preference name="DefaultVolumeStream" value="call" />
              <preference name="AndroidWindowSplashScreenAnimatedIcon" value="" />
              <content src="index.html" />
              <allow-navigation href="*" />
              <allow-intent href="*" />
              <access origin="*" />
          </widget>
          EOF
          cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: alomariya-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
